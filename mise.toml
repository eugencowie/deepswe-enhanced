[settings]
disable_backends = ["asdf"] # cannot be updated by Renovate

[plugins]
vite-plus = "https://github.com/markmals/mise-vite-plus"

[tools]
pipx = "latest"
"pipx:cruft" = "latest"
vite-plus = "latest"

[tasks.install]
description = "Install dependencies"
run = "vp install"

[tasks.update]
description = "Update dependencies"
run = "vp update"

[tasks.upgrade]
description = "Upgrade all dependencies and tooling to latest"
run = ["mise plugins upgrade", "mise upgrade --local --bump", "mise run upgrade:deps"]

[tasks."upgrade:deps"]
hide = true
run = [
  "vp env pin latest",
  "vp env exec npm --force pkg set devEngines.packageManager.version=$(vp info pnpm version)", # https://github.com/voidzero-dev/vite-plus/pull/2398
  "vp migrate",
  "vp update --latest",
]

[tasks.ready]
description = "Run checks, tests, and build"
run = "vp run ready"

[tasks.check]
description = "Run format, lint, and type checks"
run = "vp check"

[tasks.test]
description = "Run tests"
run = "vp test"

[tasks."e2e:install"]
description = "Install browsers for end-to-end tests"
run = "vp run e2e:install"

[tasks.e2e]
description = "Run end-to-end tests"
run = "vp run e2e"

[tasks.dev]
description = "Run development server"
run = "vp dev"

[tasks.build]
description = "Build for production"
run = "vp build"

[tasks.preview]
description = "Preview production build"
run = "vp preview"

[tasks.refresh]
description = "Refresh all snapshots in workflow order (DeepSWE, then OpenRouter)"
run = "vp run refresh"

[tasks."refresh:deepswe"]
description = "Refresh DeepSWE data"
run = "vp run refresh:deepswe"

[tasks."refresh:openrouter"]
description = "Refresh OpenRouter throughput data"
run = "vp run refresh:openrouter"

[tasks."template:update"]
description = "Update project with the latest changes from the template"
run = "cruft update"

[tasks."template:restore"]
description = "Restore template-managed files"
run = "cruft diff | git apply"
