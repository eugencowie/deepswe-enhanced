#
# Deploy a preview for every pull request.
#
# Repository secrets
# - CLOUDFLARE_ACCOUNT_ID: the account that owns the worker.
# - CLOUDFLARE_API_TOKEN: a user API token with the following permissions:
#   - Account Settings: Read
#   - Workers Scripts: Edit
#   - User Details: Read
#
# Repository variables
# - SITE_URL: the public URL of the site, used for canonical links.
#

name: Preview

on:
  pull_request:

# A newer push to the branch replaces the in-flight preview run.
concurrency:
  group: preview-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with: { persist-credentials: false }
      - uses: voidzero-dev/setup-vp@v1.17.0
        env: { PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1 } # no e2e here; skip the 187 MB Chromium
        with: { cache: true }
      - run: vp build
        env: { VITE_SITE_URL: "${{ vars.SITE_URL }}" }
      - uses: cloudflare/wrangler-action@v4.1.3
        with:
          command: preview
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ github.token }}
