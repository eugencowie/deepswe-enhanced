#
# Deploy to production on every push to main.
#
# Repository secrets
# - CLOUDFLARE_ACCOUNT_ID: the account that owns the worker.
# - CLOUDFLARE_API_TOKEN: a user API token with the following permissions:
#   - Account Settings: Read
#   - Workers Scripts: Edit
#   - User Details: Read
#
# Repository variables
# - SITE_URL: the public URL of the site, used for canonical links.
#
name: Deploy

on:
  push:
    branches: [main]

# Queue deploys so two quick merges cannot race to go live out of order.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        uses: voidzero-dev/setup-vp@v1.17.0
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1 # no e2e here; skip the 187 MB Chromium

      - name: Build
        run: vp build
        env:
          VITE_SITE_URL: ${{ vars.SITE_URL }}

      - name: Deploy
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
