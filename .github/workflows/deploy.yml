#
# Deploy to production on every push to main.
#
# Repository secrets
# - CLOUDFLARE_ACCOUNT_ID: the account that owns the worker.
# - CLOUDFLARE_API_TOKEN: a user API token with the following permissions:
#   - Account Settings: Read
#   - Workers Scripts: Edit
#   - User Details: Read
#
# Repository variables
# - SITE_URL: the public URL of the site, used for canonical links.
#

name: Deploy

on:
  push:
    branches: [main]

# Queue deploys so two quick merges cannot race to go live out of order.
concurrency:
  group: deploy

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: voidzero-dev/setup-vp@313600b80b104eadebb9111787d37a2e83e014ca # v1.17.0
        env: { PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1 } # no e2e here; skip the 187 MB Chromium
        with: { cache: true }
      - run: vp build
        env: { VITE_SITE_URL: "${{ vars.SITE_URL }}" }
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
