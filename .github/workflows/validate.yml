name: Validate

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          cache: true

      - name: Install tools
        uses: jdx/mise-action@v5.2.7
        with:
          # setup-vp owns Vite+ and its cache, so mise installs only the workflow linters.
          install_args: jactionlint shellcheck

      - name: Validate
        run: mise run --skip-tools validate

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
