name: Validate

on:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with: { persist-credentials: false }
      - uses: voidzero-dev/setup-vp@v1.17.0
        with: { cache: true }
      - run: vp run validate
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with: { name: playwright-report, path: playwright-report }
